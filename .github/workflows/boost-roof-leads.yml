name: Apply roof lead boost

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Patch scan pipeline
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('pipeline.py')
          s = p.read_text()

          replacements = [
              ('def _overpass_buildings(zipcode: str, lat0: float, lng0: float, limit: int = 120):',
               'def _overpass_buildings(zipcode: str, lat0: float, lng0: float, limit: int = 360):'),
              ('MICRO_SCAN_POOL = 200', 'MICRO_SCAN_POOL = 320'),
              ('PRESCREEN_PROMPT = """You are a roof triage assistant. For EACH image in order (most are aerial views; a few may be street-level photos of the house), reply with ONLY a JSON array of integers — one per image — rating visible roof condition: 1 = pristine, 2 = normal aging only, 3 = visible wear and tear (granule loss, curling or faded shingles, moss, patching), 4 = clear damage (missing shingles, exposed underlayment, sagging, tarp covering part of the roof), 5 = severe damage or failure (large tarped areas, collapsed sections). A blue or black tarp on a roof is emergency storm-damage covering — it IS damage, score it 4 or 5, NEVER 0. Use 0 only when no roof is visible at all (heavy tree cover, no building visible). Solar panels are NOT damage. Example: [2,0,4]"""',
               'PRESCREEN_PROMPT = """You are a roof triage assistant. For EACH image in order (most are aerial views; a few may be street-level photos of the house), reply with ONLY a JSON array of integers — one per image — rating visible roof condition: 1 = pristine, 2 = normal aging only, 3 = visible wear and tear (granule loss, curling or faded shingles, moss, patching), 4 = clear damage (missing shingles, exposed underlayment, sagging, or a temporary tarp covering part of the roof), 5 = severe damage or failure (large tarped areas, collapsed sections). Any temporary roof tarp — blue, black, white, gray, or another color — is emergency/storm-damage covering and IS damage: score a substantial tarp 5 and a smaller localized tarp 4, NEVER 0. Do not confuse a pool cover, driveway tarp, vehicle cover, or backyard object with a roof tarp. Use 0 only when no roof is visible at all (heavy tree cover, no building visible). Solar panels are NOT damage. Example: [2,0,5]"""'),
              ('ABANDONED / DERELICT RULE: if the target property is clearly abandoned or derelict',
               'TARP RULE: any clearly visible temporary tarp covering the target roof is direct evidence of active roof failure or storm repair. A substantial tarp covering a roof slope is grade 1. A smaller localized roof tarp is grade 2 unless other visible evidence makes the roof failing. Never require the tarp to be blue; distinguish roof tarps from pool covers and yard objects.\n\nABANDONED / DERELICT RULE: if the target property is clearly abandoned or derelict'),
              ('"obstruction_notes": {"type": "STRING",\n                                              "description": "Tree shadows, solar panels, canopy coverage, glare; empty string if clear"},',
               '"obstruction_notes": {"type": "STRING",\n                                              "description": "Tree shadows, solar panels, canopy coverage, glare; empty string if clear"},\n                        "tarp_detected": {"type": "BOOLEAN",\n                                           "description": "True only when a temporary tarp visibly covers the target roof; false for pool/yard/vehicle covers"},\n                        "tarp_confidence": {"type": "STRING",\n                                             "enum": ["low", "medium", "high"]},'),
              ('"obstruction": str(g.get("obstruction_notes", ""))[:160],\n                        "damage_boxes": boxes})',
               '"obstruction": str(g.get("obstruction_notes", ""))[:160],\n                        "tarp_detected": bool(g.get("tarp_detected", False)),\n                        "tarp_confidence": str(g.get("tarp_confidence", "low"))[:10],\n                        "damage_boxes": boxes})'),
              ('"obstruction", "damage_boxes", "abandoned"):',
               '"obstruction", "tarp_detected", "tarp_confidence", "damage_boxes", "abandoned"):')
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'pipeline.py patch target not found: {old[:100]}')
              s = s.replace(old, new, 1)

          p.write_text(s)

          p = Path('server.py')
          s = p.read_text()
          old = 'count = max(5, min(30, int(body.get("count", 20))))'
          new = 'count = max(5, min(40, int(body.get("count", 30))))'
          if old not in s:
              raise SystemExit('server.py count cap patch target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('static/index.html')
          s = p.read_text()
          old = '''      <select id="countSel" title="Roofs to scan">\n        <option value="10">10 roofs</option>\n        <option value="20" selected>20 roofs</option>\n        <option value="30">30 roofs</option>\n      </select>'''
          new = '''      <select id="countSel" title="Roofs to scan">\n        <option value="10">10 roofs</option>\n        <option value="20">20 roofs</option>\n        <option value="30" selected>30 roofs</option>\n        <option value="40">40 roofs</option>\n      </select>'''
          if old not in s:
              raise SystemExit('index.html count selector patch target not found')
          s = s.replace(old, new, 1)
          s = s.replace('id="pinCountEcho">20</span>', 'id="pinCountEcho">30</span>', 1)
          s = s.replace("(($('countSel') || {}).value || '20')", "(($('countSel') || {}).value || '30')", 1)
          s = s.replace("parseInt(($('countSel') || {}).value || '20', 10)", "parseInt(($('countSel') || {}).value || '30', 10)", 1)
          p.write_text(s)

          compile(Path('pipeline.py'), doraise=True)
          compile(Path('server.py'), doraise=True)
          print('Python syntax OK')
          PY
      - name: Commit changes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline.py server.py static/index.html
          git rm .github/workflows/boost-roof-leads.yml
          git commit -m "Increase scan recall and tarp lead detection"
          git push