name: Apply strict Grade 1 verification

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add strict verifier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          path = Path("sitecustomize.py")
          text = path.read_text()
          marker = "# STRICT-GRADE1-VERIFICATION-V1"
          if marker in text:
              print("Strict Grade 1 verifier already present")
              raise SystemExit(0)

          block = r'''

# STRICT-GRADE1-VERIFICATION-V1
# A first-pass Grade 1 is only a candidate. This second pass requires
# unmistakable visible failure evidence before the report can call it Grade 1.
try:
    import base64
    import pipeline

    _original_grade_roofs_strict = pipeline.grade_roofs

    _GRADE1_STRICT_PROMPT = """You are the final quality-control reviewer for an aerial residential roof lead.

The previous model marked this roof as Grade 1 (failing/replacement-level). Your job is NOT to be generous. Confirm Grade 1 only when the image contains strong, unmistakable, visible evidence of severe roof failure.

GRADE 1 IS CONFIRMED ONLY IF you can clearly see one or more of:
- a substantial temporary roof tarp covering a meaningful roof area
- a large section of missing roof covering with exposed underlayment/decking
- a major open hole or missing roof section
- a visibly collapsed or strongly sagging roof section
- severe structural deformation
- unmistakable widespread material failure that is clearly replacement-level from the image

DO NOT confirm Grade 1 for:
- discoloration, staining, fading, or rough texture alone
- ordinary aging or granule/color variation
- ponding alone
- ordinary patches or maintenance repairs
- shadows, glare, compression artifacts, or trees
- vents, plumbing stacks, HVAC units, ducts, skylights, chimneys, solar panels, satellite dishes, or other normal rooftop equipment
- a dark rectangle/open-looking shape unless it is clearly a real roof opening
- a small localized defect that is better described as repair-level

If there is visible real damage but it is NOT clearly failing/replacement-level, return Grade 2 or 3. If the roof cannot be reliably judged, return 0.

Return only the requested JSON object."""

    _GRADE1_STRICT_SCHEMA = {
        "type": "OBJECT",
        "properties": {
            "grade": {"type": "INTEGER", "description": "0 unclear, 2 worn/repair soon, 3 aging/watch, 1 only when unmistakable failing/replacement-level evidence is visible"},
            "confirmed": {"type": "BOOLEAN"},
            "confidence": {"type": "STRING", "enum": ["low", "medium", "high"]},
            "reason": {"type": "STRING"},
            "evidence_type": {"type": "STRING"},
        },
        "required": ["grade", "confirmed", "confidence", "reason", "evidence_type"],
    }

    def _strict_grade1_image(h, api_key):
        image_b64 = h.get("image_b64")
        if not image_b64 or not api_key:
            return None

        # Prefer a tighter Esri crop around the known roof coordinate. If the
        # crop is unavailable, fall back to the already-validated roof image.
        image = None
        try:
            z = int(h.get("image_zoom") or 20)
            image = pipeline._centered_esri(float(h["lat"]), float(h["lng"]), min(20, z + 1))
        except Exception:
            image = None
        crop_b64 = base64.b64encode(image).decode() if image else image_b64

        parts = [
            {"text": _GRADE1_STRICT_PROMPT},
            {"text": "The target roof is centered in this image. Review only visible evidence on that roof."},
            {"inline_data": {"mime_type": "image/jpeg", "data": crop_b64}},
        ]
        try:
            return pipeline._gemini_json(
                api_key, parts, _GRADE1_STRICT_SCHEMA, max_tokens=700
            )
        except Exception:
            return None

    def _verify_grade1_candidates(api_key, houses, progress=None):
        candidates = [
            h for h in houses
            if int(h.get("grade", 0) or 0) == 1 and h.get("image_b64")
        ]
        if not candidates:
            return houses

        verified = 0
        for idx, h in enumerate(candidates, 1):
            raw = _strict_grade1_image(h, api_key)
            if not isinstance(raw, dict):
                # Fail closed: a failed QC call must not manufacture a Grade 1.
                h["grade"] = 0
                h["grade1_verified"] = False
                h["grade1_verification_confidence"] = "low"
                h["grade1_verification_reason"] = "Final Grade 1 verification was unavailable; roof condition could not be confirmed from the available image."
                h["evidence_type"] = "unverified"
                continue

            confirmed = bool(raw.get("confirmed")) and int(raw.get("grade", 0) or 0) == 1
            confidence = str(raw.get("confidence", "low"))[:10]
            reason = str(raw.get("reason", ""))[:300]
            evidence_type = str(raw.get("evidence_type", "visible severe failure"))[:100]

            if confirmed and confidence in ("medium", "high"):
                h["grade"] = 1
                h["grade1_verified"] = True
                h["grade1_verification_confidence"] = confidence
                h["grade1_verification_reason"] = reason
                h["evidence_type"] = evidence_type
                verified += 1
            else:
                fallback = int(raw.get("grade", 0) or 0)
                if fallback not in (0, 2, 3):
                    fallback = 0
                h["grade"] = fallback
                h["grade1_verified"] = False
                h["grade1_verification_confidence"] = confidence
                h["grade1_verification_reason"] = reason or "The visible evidence did not meet the strict Grade 1 threshold."
                h["evidence_type"] = evidence_type or "not confirmed"

            # Never leave the report implying that an unconfirmed Grade 1 was
            # established. Preserve the original observations but make the
            # interpretation explicitly conditional.
            if not h.get("grade1_verified"):
                ev = list(h.get("evidence") or [])
                ev.append("AI quality control did not confirm replacement-level failure from the available aerial image.")
                h["evidence"] = ev[:3]

            if progress:
                progress("grade", idx, len(candidates),
                         f"Quality-checking potential Grade 1 roofs: {idx}/{len(candidates)}")

        return houses

    def _grade_roofs_with_strict_qc(api_key, houses, progress=None, grader=None, evidencer=None):
        out = _original_grade_roofs_strict(
            api_key, houses, progress, grader=grader, evidencer=evidencer
        )
        return _verify_grade1_candidates(api_key, out, progress=progress)

    pipeline.grade_roofs = _grade_roofs_with_strict_qc
except Exception as _strict_grade1_error:
    print(f"Roof Scout strict Grade 1 verification skipped: {_strict_grade1_error}", flush=True)
'''

          path.write_text(text.rstrip() + block + "\n")
          py_compile.compile(str(path), doraise=True)
          print("sitecustomize.py syntax OK")
          PY

      - name: Commit verifier
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitecustomize.py
          git commit -m "Require strict evidence before Grade 1"
          git push

      - name: Remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-grade1-verification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-shot Grade 1 workflow"
          git push
